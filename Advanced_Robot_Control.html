<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Robot Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top bar + one centered content column; home is a 5-card launch grid; presentation mode is a full-screen stage. Single dark look by design (robotics/AI theme requested). */
:root{
  --bg:#05060f; --bg2:#0b0a24; --purple:#6d28d9; --ink:#e8ecff; --ink2:#a4aed4; --ink3:#6f7aa6;
  --cyan:#22e4ff; --violet:#a35bff; --pink:#ff5cb8; --good:#34f5a3; --bad:#ff5c7a;
  --glass:rgba(18,20,52,.62); --line:rgba(120,140,255,.22); --line2:rgba(34,228,255,.45);
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:radial-gradient(1200px 700px at 12% -10%,rgba(109,40,217,.38),transparent 60%),radial-gradient(900px 600px at 100% 10%,rgba(34,228,255,.14),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 70%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);
  animation:drift 26s linear infinite}
@keyframes drift{to{background-position:56px 56px}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--f-mono)}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{font:600 .8rem var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);background:none;border:0;padding:6px 0;display:flex;gap:10px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;color:var(--ink2);transition:.2s}
.nav button:hover,.nav button[aria-current=true]{color:var(--ink);border-color:var(--line2);box-shadow:0 0 18px rgba(34,228,255,.25)}
/* glass */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:24px;position:relative}
.glow:hover{border-color:var(--line2);box-shadow:0 0 0 1px rgba(34,228,255,.2),0 10px 40px rgba(109,40,217,.35)}
/* home */
.hero{padding:36px 0 30px}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--pink)}
.hero h1{font-size:clamp(2.1rem,7.5vw,4.6rem);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 8px;background:linear-gradient(95deg,#fff 10%,var(--cyan) 50%,var(--violet) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.hero p{margin:0;font:500 1.15rem var(--f-display);color:var(--ink2);letter-spacing:.06em}
.notice{border-color:rgba(255,92,184,.5);background:linear-gradient(135deg,rgba(255,92,184,.12),rgba(18,20,52,.62));margin-bottom:24px}
.notice h3{font-size:1rem;color:var(--pink);margin-bottom:6px}
.notice p{margin:0;color:var(--ink2);font-size:.93rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{text-align:left;display:flex;flex-direction:column;gap:8px;transition:.25s;min-width:0}
.card:hover{transform:translateY(-4px)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(34,228,255,.18),rgba(163,91,255,.22));border:1px solid var(--line2)}
.card .ic svg{width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.2rem}
.card span.meta{font:500 .78rem var(--f-mono);color:var(--ink3);letter-spacing:.06em}
.card span.meta.ok{color:var(--good)}
.card span.meta.miss{color:var(--pink)}
/* sections */
.sec-head{margin-bottom:22px}
.sec-head h2{font-size:clamp(1.6rem,4.5vw,2.4rem)}
.sec-head p{margin:6px 0 0;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{text-align:center;padding:40px 24px}
.empty h3{color:var(--pink);margin-bottom:8px}
.empty p{color:var(--ink2);margin:0 auto;max-width:56ch}
.empty code{font-family:var(--f-mono);color:var(--cyan)}
.prose p{margin:0 0 12px}.prose p:last-child{margin:0}
.prose strong{color:var(--cyan);font-weight:600}
.prose code,.eq{font-family:var(--f-mono);background:rgba(34,228,255,.1);border:1px solid rgba(34,228,255,.25);border-radius:6px;padding:1px 7px;color:var(--ink)}
.qn{font:600 .75rem var(--f-mono);color:var(--violet);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.ans{margin-top:14px;padding:16px;border-radius:14px;background:rgba(52,245,163,.07);border:1px solid rgba(52,245,163,.35)}
.btn{background:linear-gradient(135deg,rgba(34,228,255,.2),rgba(163,91,255,.28));border:1px solid var(--line2);border-radius:12px;padding:10px 18px;font-weight:500;transition:.2s}
.btn:hover:not(:disabled){box-shadow:0 0 22px rgba(34,228,255,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
/* quiz */
.prog{height:8px;border-radius:99px;background:rgba(120,140,255,.15);overflow:hidden;margin:10px 0 18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 14px var(--cyan);transition:width .4s}
.qmeta{display:flex;justify-content:space-between;font:500 .82rem var(--f-mono);color:var(--ink2);gap:10px;flex-wrap:wrap}
.qtext{font-size:clamp(1.15rem,3vw,1.5rem);font-family:var(--f-display);font-weight:600;margin:6px 0 18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin-bottom:18px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:rgba(10,12,36,.6);border:1px solid var(--line);border-radius:14px;padding:13px 16px;transition:.2s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--line2)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:600 .85rem var(--f-mono);border:1px solid var(--line);color:var(--ink2)}
.opt .t{padding-top:3px;overflow-wrap:anywhere;min-width:0}
.opt.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(34,228,255,.25)}
.opt.sel .k{background:var(--cyan);color:#001018;border-color:var(--cyan)}
.opt.right{border-color:var(--good);background:rgba(52,245,163,.1)}
.opt.right .k{background:var(--good);color:#00150c;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,92,122,.1)}
.opt.wrong .k{background:var(--bad);color:#190006;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{padding:16px;border-radius:14px;margin-bottom:18px;border:1px solid}
.fb.ok{border-color:rgba(52,245,163,.5);background:rgba(52,245,163,.08)}
.fb.no{border-color:rgba(255,92,122,.5);background:rgba(255,92,122,.08)}
.fb b{font-family:var(--f-display);font-size:1.05rem}
.fb.ok b{color:var(--good)}.fb.no b{color:var(--bad)}
.fb p{margin:6px 0 0;color:var(--ink)}
.score{display:grid;place-items:center;text-align:center;gap:6px;padding:10px 0 20px}
.ring{--p:0;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) calc(var(--p)*1%),rgba(120,140,255,.15) 0);position:relative;box-shadow:0 0 40px rgba(34,228,255,.25)}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg2)}
.ring b{position:relative;font:700 2.2rem var(--f-display)}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0 20px}
.stat{padding:10px 18px;border-radius:12px;border:1px solid var(--line);min-width:110px}
.stat b{display:block;font:700 1.5rem var(--f-display)}
.stat.g b{color:var(--good)}.stat.r b{color:var(--bad)}
.rv{display:flex;flex-direction:column;gap:12px}
.rv .item{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(10,12,36,.5)}
.rv .item.ok{border-left:4px solid var(--good)}.rv .item.no{border-left:4px solid var(--bad)}
.rv small{color:var(--ink3);font-family:var(--f-mono)}
.rv .line{margin:4px 0;color:var(--ink2);font-size:.93rem}
.rv .line b{color:var(--ink)}
/* presentation */
.stage{position:fixed;inset:0;z-index:50;background:var(--bg);background-image:radial-gradient(1000px 600px at 20% 0%,rgba(109,40,217,.4),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(34,228,255,.16),transparent 60%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage-top,.stage-bot{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.stage-top .tag{font:500 .8rem var(--f-mono);color:var(--cyan);letter-spacing:.15em;text-transform:uppercase}
.stage-top .sp{flex:1}
.slide-box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px max(20px,env(safe-area-inset-left,0px));overflow-y:auto}
.slide{width:min(1100px,100%);animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.slide h2{font-size:clamp(1.8rem,5vw,3.4rem);margin-bottom:22px}
.slide .qtext{font-size:clamp(1.5rem,4vw,2.8rem)}
.slide .opt{font-size:clamp(1.05rem,2.4vw,1.7rem);padding:14px 20px}
.slide .opt .k{width:38px;height:38px}
.slide .prose{font-size:clamp(1.05rem,2.3vw,1.6rem);line-height:1.55}
.slide .ans{font-size:clamp(1rem,2.2vw,1.5rem)}
.stage .prog{margin:0;height:5px;border-radius:0}
/* fallback */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.grid-bg{animation:none}}
@media (max-width:560px){.glass{padding:18px}.nav{margin-left:0}.btn{padding:10px 14px}}
</style>

</head><body><canvas id="fx" aria-hidden="true"></canvas>
<div class="grid-bg" aria-hidden="true"></div>
<div class="wrap" id="app"></div>


<script>
/* ===================== DATA (edit here) =====================
   Source: "Advanced Robot Control – First 10 MCQs" (Lecture 4 — Advanced Robot Control).
   That file contains ONLY the 10 MCQs below. Lecture summary, essay questions,
   the other 20 MCQs and all true/false items are not in it, so those arrays are empty.
   Add items in these formats and the app picks them up automatically:
   summary: {title, body}   (body: plain text; blank line = new paragraph; **bold**; `equation`)
   essays:  {q, a}
   mcq:     {q, options:{A,B,C,D}, answer:'B', explanation}
   tf:      {q, answer:'True'|'False', explanation}  (explanation = correction)
*/
const DATA = {
  expected:{summary:null, essays:15, mcq:30, tf:30},
  source:"Lecture 4 — Advanced Robot Control.",
  summary:[],
  essays:[],
  mcq:[
    {q:"What is the main objective of robot control?",options:{A:"Increase the robot's weight",B:"Achieve accurate, smooth, and safe motion",C:"Eliminate all sensors",D:"Increase friction"},answer:"B",explanation:"Robot control generates commands to achieve accurate, smooth, and safe movement."},
    {q:"Why are advanced control methods necessary in modern robots?",options:{A:"Robots never experience disturbances",B:"Robots have perfectly linear dynamics",C:"Robots may experience nonlinear dynamics and uncertainties",D:"Robots do not require feedback"},answer:"C",explanation:"Nonlinear dynamics, friction, payload changes, and disturbances can affect performance."},
    {q:"What does the controller attempt to minimize?",options:{A:"Tracking error",B:"Robot mass",C:"Sensor quantity",D:"Payload size"},answer:"A",explanation:"The controller minimizes the difference between desired and actual robot states."},
    {q:"Which component determines what the robot should do?",options:{A:"Actuator",B:"Task planner",C:"Friction model",D:"Disturbance observer"},answer:"B",explanation:"The task planner determines the task the robot must perform."},
    {q:"What is the role of a trajectory generator?",options:{A:"Measure external forces only",B:"Remove the robot's actuators",C:"Convert a task into desired positions, velocities, and accelerations",D:"Increase modeling errors"},answer:"C",explanation:"It generates the desired motion information for the controller."},
    {q:"Which component sends control actions to the robot's mechanical system?",options:{A:"Actuators",B:"Task planner",C:"Trajectory generator",D:"Mathematical equation"},answer:"A",explanation:"Actuators execute control commands to produce robot motion."},
    {q:"What is the joint-space tracking error?",options:{A:"e = q + qd",B:"e = qd − q",C:"e = qd × q",D:"e = q / qd"},answer:"B",explanation:"The error equals the desired joint position minus the measured position."},
    {q:"What does CTC stand for?",options:{A:"Continuous Trajectory Calculation",B:"Computer Tracking Circuit",C:"Computed-Torque Control",D:"Controlled Timing Correction"},answer:"C",explanation:"CTC uses the robot's dynamic model to compensate for nonlinear effects."},
    {q:"Which control method relies on the robot's mathematical dynamic model?",options:{A:"Computed-Torque Control",B:"Task planning only",C:"Sensor measurement only",D:"Trajectory generation only"},answer:"A",explanation:"CTC uses a mathematical model of robot dynamics to calculate the control torque."},
    {q:"Which term represents inertia in the robot dynamics equation?",options:{A:"G(q)",B:"F(q̇)",C:"M(q)",D:"τ"},answer:"C",explanation:"M(q) represents the inertia matrix."}
  ],
  tf:[]
};
DATA.tf.forEach(t=>t.options={True:"True",False:"False"});

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
const paras=s=>String(s).split(/\n\s*\n/).map(p=>'<p>'+fmt(p).replace(/\n/g,'<br>')+'</p>').join('');
const ICON={
  summary:'<svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h8"/></svg>',
  essays:'<svg viewBox="0 0 24 24"><path d="M4 20l1-4L17 4l3 3L8 19z"/><path d="M14 7l3 3"/></svg>',
  mcq:'<svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg>',
  tf:'<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>',
  present:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>'
};
const SECS=[
  {id:'mcq',name:'MCQ Quiz',key:'mcq',desc:'One question at a time with instant feedback.'}
];
function countLabel(s){
  if(!s.key)return {t:'Slides from all sections',c:'ok'};
  const n=DATA[s.key].length,e=DATA.expected[s.key];
  if(n===0)return {t:'Not in source file',c:'miss'};
  if(e&&n<e)return {t:n+' of '+e+' items in source',c:'miss'};
  return {t:n+' items',c:'ok'};
}
function emptyBlock(key,label){
  const e=DATA.expected[key];
  return `<div class="glass empty"><h3>No ${esc(label)} in the source document</h3><p>The attached Word file ("First 10 Multiple-Choice Questions") does not contain ${e?('the '+e+' '):'any '}${esc(label)}. Nothing was invented to fill the gap. Add the content to <code>DATA.${key}</code> at the top of the HTML file and this section will appear.</p></div>`;
}

/* ===================== router ===================== */
const view=$('#app');
let currentQuiz=null;
function go(id){location.hash=id||''}
function route(){
  const id=location.hash.replace('#','')||'home';
  currentQuiz=null;
  window.scrollTo(0,0);
  if(id==='mcq'){view.innerHTML=shell(id,'<div id="quiz"></div>');startQuiz(id)}
  else view.innerHTML=renderHome();
  bindNav();
}
function navBar(active){
  return `<div class="bar"><button class="brand" data-go="" aria-label="Home"><i></i>Advanced Robot Control</button><nav class="nav" hidden aria-label="Sections">${SECS.map(s=>`<button data-go="${s.id}" ${s.id===active?'aria-current="true"':''}>${s.name.replace(' Quiz','').replace(' Questions','')}</button>`).join('')}</nav></div>`;
}
function shell(id,body){
  const s=SECS.find(x=>x.id===id);
  return navBar(id)+`<div class="sec-head"><div class="eyebrow">Lecture 4</div><h2>${s.name}</h2></div>`+body;
}
function bindNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function renderHome(){
  return `<div class="hero"><div class="eyebrow">Lecture 4 · Robot Dynamics &amp; Control</div><h1>Advanced Robot Control</h1><p>Interactive Learning &amp; Assessment</p></div>
  <div class="cards"><button class="glass glow card" data-go="mcq"><span class="ic">${ICON.mcq}</span><h3>MCQ Quiz</h3><span>10 questions, one at a time, with instant feedback and explanations.</span><span class="meta ok">Start quiz</span></button></div>`;
}
window.addEventListener('hashchange',route);

/* ===================== summary / essays ===================== */
function renderSummary(){
  if(!DATA.summary.length)return emptyBlock('summary','lecture summary');
  return '<div class="stack">'+DATA.summary.map((s,i)=>`<article class="glass glow"><div class="qn">Part ${i+1}</div><h3 style="margin-bottom:12px">${esc(s.title)}</h3><div class="prose">${paras(s.body)}</div></article>`).join('')+'</div>';
}
function renderEssays(){
  if(!DATA.essays.length)return emptyBlock('essays','essay questions');
  return '<div class="row" style="margin-bottom:16px"><button class="btn ghost" id="eAll">Show all answers</button><button class="btn ghost" id="eNone">Hide all answers</button></div><div class="stack">'+DATA.essays.map((e,i)=>`<article class="glass glow"><div class="qn">Essay ${i+1} of ${DATA.essays.length}</div><h3 style="margin-bottom:14px;font-size:1.2rem">${esc(e.q)}</h3><button class="btn" data-e="${i}" aria-expanded="false" aria-controls="ea${i}">Show answer</button><div class="ans prose" id="ea${i}" hidden>${paras(e.a)}</div></article>`).join('')+'</div>';
}
function bindEssays(){
  const set=(i,show)=>{const a=$('#ea'+i),b=document.querySelector(`[data-e="${i}"]`);if(!a)return;a.hidden=!show;b.textContent=show?'Hide answer':'Show answer';b.setAttribute('aria-expanded',show)};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>set(b.dataset.e,$('#ea'+b.dataset.e).hidden));
  const a=$('#eAll'),n=$('#eNone');
  if(a){a.onclick=()=>DATA.essays.forEach((_,i)=>set(i,true));n.onclick=()=>DATA.essays.forEach((_,i)=>set(i,false))}
}

/* ===================== quiz engine ===================== */
function startQuiz(kind){
  const items=DATA[kind],box=$('#quiz');
  if(!items.length){box.innerHTML=emptyBlock(kind,kind==='mcq'?'multiple-choice questions':'true/false statements');return}
  const st={i:0,picked:new Array(items.length).fill(null),done:new Array(items.length).fill(false),finished:false,review:false,onlyWrong:false};
  const keys=it=>Object.keys(it.options);
  const correctCount=()=>items.filter((it,k)=>st.done[k]&&st.picked[k]===it.answer).length;
  const label=(it,k)=>kind==='tf'?it.options[k]:k;
  const textOf=(it,k)=>kind==='tf'?it.options[k]:it.options[k];
  function draw(){
    if(st.finished)return drawResults();
    const it=items[st.i],done=st.done[st.i],pick=st.picked[st.i];
    const pct=((st.i+(done?1:0))/items.length*100).toFixed(1);
    const right=done&&pick===it.answer;
    box.innerHTML=`<div class="glass"><div class="qmeta"><span>${kind==='mcq'?'Question':'Statement'} ${st.i+1} of ${items.length}</span><span>Score ${correctCount()} / ${st.done.filter(Boolean).length} answered</span></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${st.done.filter(Boolean).length}"><i style="width:${pct}%"></i></div>
    <div class="qtext">${esc(it.q)}</div>
    <div class="opts" role="radiogroup">${keys(it).map(k=>{let c='opt';if(done){if(k===it.answer)c+=' right';else if(k===pick)c+=' wrong'}else if(k===pick)c+=' sel';
      return `<button class="${c}" data-k="${esc(k)}" role="radio" aria-checked="${k===pick}" ${done?'disabled':''}><span class="k">${kind==='tf'?esc(k[0]):esc(k)}</span><span class="t">${esc(textOf(it,k))}</span></button>`}).join('')}</div>
    ${done?`<div class="fb ${right?'ok':'no'}" role="status"><b>${right?'Correct':'Incorrect'}</b><p><strong>Correct answer: ${kind==='mcq'?esc(it.answer)+'. '+esc(it.options[it.answer]):esc(it.answer)}</strong></p><p>${kind==='tf'?'Correction / explanation: ':'Explanation: '}${esc(it.explanation)}</p></div>`:''}
    <div class="row end"><div class="row"><button class="btn ghost" id="prev" ${st.i===0?'disabled':''}>Previous</button><button class="btn ghost" id="restart">Restart Quiz</button></div>
    <div class="row">${done?`<button class="btn" id="next">${st.i===items.length-1?'See results':'Next Question'}</button>`:`<button class="btn" id="submit" ${pick==null?'disabled':''}>Submit answer</button>`}</div></div>
    <p style="margin:14px 0 0;color:var(--ink3);font-size:.8rem">Keys: ${kind==='mcq'?'A–D or 1–4 select':'T / F select'} · Enter submits or continues · ← → move</p></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.picked[st.i]=b.dataset.k;draw()});
    const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
    on('submit',submit);on('next',next);on('prev',()=>{st.i--;draw()});on('restart',restart);
  }
  function submit(){if(st.picked[st.i]==null||st.done[st.i])return;st.done[st.i]=true;draw()}
  function next(){if(!st.done[st.i])return;if(st.i===items.length-1){st.finished=true;st.review=false}else st.i++;draw()}
  function restart(){st.i=0;st.picked.fill(null);st.done.fill(false);st.finished=false;st.review=false;st.onlyWrong=false;draw()}
  function drawResults(){
    const total=items.length,ok=correctCount(),answered=st.done.filter(Boolean).length,bad=total-ok,pct=Math.round(ok/total*100);
    if(st.review){
      const list=items.map((it,k)=>({it,k,ok:st.done[k]&&st.picked[k]===it.answer})).filter(x=>!st.onlyWrong||!x.ok);
      box.innerHTML=`<div class="glass"><div class="row end" style="margin-bottom:16px"><h3>Review answers</h3><div class="row"><button class="btn ghost" id="tog">${st.onlyWrong?'Show all':'Show mistakes only'}</button><button class="btn ghost" id="back">Back to results</button></div></div><div class="rv">${list.length?list.map(({it,k,ok})=>{const p=st.picked[k];
        return `<div class="item ${ok?'ok':'no'}"><small>${kind==='mcq'?'Q':'Statement '}${k+1} · ${ok?'Correct':(st.done[k]?'Incorrect':'Not answered')}</small><div style="margin:4px 0 8px;font-weight:500">${esc(it.q)}</div><div class="line">Your answer: <b>${p==null?'—':(kind==='mcq'?esc(p)+'. '+esc(it.options[p]):esc(p))}</b></div><div class="line">Correct answer: <b>${kind==='mcq'?esc(it.answer)+'. '+esc(it.options[it.answer]):esc(it.answer)}</b></div><div class="line">${kind==='tf'?'Correction: ':'Explanation: '}${esc(it.explanation)}</div></div>`}).join(''):'<p style="color:var(--good)">No mistakes to show.</p>'}</div></div>`;
      $('#tog').onclick=()=>{st.onlyWrong=!st.onlyWrong;draw()};$('#back').onclick=()=>{st.review=false;draw()};return;
    }
    const msg=pct===100?'Perfect score.':pct>=70?'Solid result.':'Review the explanations and try again.';
    box.innerHTML=`<div class="glass"><div class="score"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><h3>${ok} of ${total} correct</h3><p style="margin:0;color:var(--ink2)">${msg}</p></div>
    <div class="stats"><div class="stat g"><b>${ok}</b>Correct</div><div class="stat r"><b>${bad}</b>Incorrect${answered<total?' / skipped':''}</div><div class="stat"><b>${total}</b>Total</div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="rev">Review answers</button>${bad?'<button class="btn ghost" id="mist">Review mistakes</button>':''}<button class="btn ghost" id="again">Restart Quiz</button><button class="btn ghost" id="prevq">Back to last question</button></div></div>`;
    $('#rev').onclick=()=>{st.review=true;st.onlyWrong=false;draw()};
    const m=$('#mist');if(m)m.onclick=()=>{st.review=true;st.onlyWrong=true;draw()};
    $('#again').onclick=restart;$('#prevq').onclick=()=>{st.finished=false;draw()};
  }
  currentQuiz={keydown(e){
    if(st.finished)return;const it=items[st.i];
    if(e.key==='Enter'){e.preventDefault();st.done[st.i]?next():submit();return}
    if(e.key==='ArrowRight'&&st.done[st.i]){next();return}
    if(e.key==='ArrowLeft'&&st.i>0){st.i--;draw();return}
    if(st.done[st.i])return;
    const ks=keys(it);let k=null;const u=e.key.toUpperCase();
    if(kind==='mcq'){if(ks.includes(u))k=u;else if(/^[1-9]$/.test(e.key)&&ks[e.key-1])k=ks[e.key-1]}
    else{if(u==='T')k='True';if(u==='F')k='False'}
    if(k){st.picked[st.i]=k;draw()}
  }};
  draw();
}
document.addEventListener('keydown',e=>{
  
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(currentQuiz)currentQuiz.keydown(e);
});

/* ===================== presentation mode ===================== */
let slides=[],si=0,reveal=false;
function buildSlides(){
  const s=[{t:'title'}];
  DATA.summary.forEach((x,i)=>s.push({t:'sum',x,i}));
  DATA.essays.forEach((x,i)=>s.push({t:'essay',x,i}));
  DATA.mcq.forEach((x,i)=>s.push({t:'mcq',x,i}));
  DATA.tf.forEach((x,i)=>s.push({t:'tf',x,i}));
  return s;
}
function openStage(){slides=buildSlides();si=0;reveal=false;$('#stage').hidden=false;document.body.style.overflow='hidden';drawStage()}
function closeStage(){const st=$('#stage');if(st.hidden)return;st.hidden=true;document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function drawStage(){
  const sl=slides[si];let body='';
  const opts=(x,kind)=>`<div class="opts">${Object.keys(x.options).map(k=>`<div class="opt ${reveal&&k===x.answer?'right':''}"><span class="k">${kind==='tf'?esc(k[0]):esc(k)}</span><span class="t">${esc(x.options[k])}</span></div>`).join('')}</div>`;
  const answer=(txt)=>reveal?`<div class="ans">${txt}</div>`:'';
  if(sl.t==='title')body=`<div class="eyebrow">Lecture 4</div><h2 style="font-size:clamp(2.2rem,7vw,5rem);text-transform:uppercase;letter-spacing:.04em;margin-top:10px;background:linear-gradient(95deg,#fff,var(--cyan) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent">Advanced Robot Control</h2><p style="font:500 1.4rem var(--f-display);color:var(--ink2);margin:0">Interactive Learning &amp; Assessment</p><p style="color:var(--ink3);margin-top:24px">${slides.length-1} content slide${slides.length===2?'':'s'} · ← → to move · Space to reveal answers · F for full screen</p>`;
  if(sl.t==='sum')body=`<div class="qn">Lecture summary · part ${sl.i+1}</div><h2>${esc(sl.x.title)}</h2><div class="prose">${paras(sl.x.body)}</div>`;
  if(sl.t==='essay')body=`<div class="qn">Essay ${sl.i+1} of ${DATA.essays.length}</div><div class="qtext">${esc(sl.x.q)}</div>${answer('<div class="prose">'+paras(sl.x.a)+'</div>')}`;
  if(sl.t==='mcq')body=`<div class="qn">MCQ ${sl.i+1} of ${DATA.mcq.length}</div><div class="qtext">${esc(sl.x.q)}</div>${opts(sl.x,'mcq')}${answer('<strong>Answer: '+esc(sl.x.answer)+'. '+esc(sl.x.options[sl.x.answer])+'</strong><br>'+esc(sl.x.explanation))}`;
  if(sl.t==='tf')body=`<div class="qn">True or false ${sl.i+1} of ${DATA.tf.length}</div><div class="qtext">${esc(sl.x.q)}</div>${answer('<strong>Answer: '+esc(sl.x.answer)+'</strong><br>'+esc(sl.x.explanation))}`;
  const canReveal=['essay','mcq','tf'].includes(sl.t);
  const sec=({title:'Welcome',sum:'Summary',essay:'Essay',mcq:'MCQ',tf:'True / False'})[sl.t];
  $('#stage').innerHTML=`<div class="stage-top"><span class="tag">${sec} · ${si+1} / ${slides.length}</span><span class="sp"></span><button class="btn ghost" id="sFs">Full screen</button><button class="btn ghost" id="sX">Exit</button></div>
  <div class="prog"><i style="width:${(si+1)/slides.length*100}%"></i></div>
  <div class="slide-box"><div class="slide" key="${si}">${body}</div></div>
  <div class="stage-bot"><button class="btn ghost" id="sP" ${si===0?'disabled':''}>Previous</button>${canReveal?`<button class="btn" id="sR">${reveal?'Hide answer':'Show answer'}</button>`:''}<span class="sp" style="flex:1"></span><button class="btn" id="sN" ${si===slides.length-1?'disabled':''}>Next</button></div>`;
  $('#sX').onclick=()=>go('');$('#sFs').onclick=fs;$('#sP').onclick=()=>step(-1);$('#sN').onclick=()=>step(1);
  const r=$('#sR');if(r)r.onclick=()=>{reveal=!reveal;drawStage()};
}
function step(d){const n=si+d;if(n<0||n>=slides.length)return;si=n;reveal=false;drawStage()}
function fs(){const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{})}
function stageKey(e){
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}
  else if(e.key===' '||e.key==='Enter'){if(['essay','mcq','tf'].includes(slides[si].t)){e.preventDefault();reveal=!reveal;drawStage()}}
  else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='Escape'&&!document.fullscreenElement)go('');
}

/* ===================== particles ===================== */
(function(){
  const c=$('#fx'),x=c.getContext('2d');let W,H,P=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)');
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;const n=Math.min(70,Math.floor(W*H/22000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,c:Math.random()<.6?'34,228,255':Math.random()<.5?'163,91,255':'255,92,184'}))}
  function frame(){
    x.clearRect(0,0,W,H);
    for(const p of P){if(!reduce.matches){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      x.fillStyle=`rgba(${p.c},.8)`;x.beginPath();x.arc(p.x,p.y,1.6,0,6.3);x.fill()}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle=`rgba(${a.c},${(1-d/130)*.25})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    if(!reduce.matches)requestAnimationFrame(frame)
  }
  addEventListener('resize',()=>{size();if(reduce.matches)frame()});size();frame();
  reduce.addEventListener&&reduce.addEventListener('change',()=>{if(!reduce.matches)frame()});
})();
route();
</script>
